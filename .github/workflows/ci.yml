name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: unit tests
        run: python -m unittest discover -s tests -v
      - name: install server extras
        run: python -m pip install -e ".[server]"
      - name: import check
        run: python -c "import amem, amem.store; print(amem.__version__)"
